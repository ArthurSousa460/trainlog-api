name: CI/CD Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: trainlog_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trainlog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5 

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar testes
        env:
          POSTGRES_DB: trainlog_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_PORT: 5432
        run: ./mvnw test