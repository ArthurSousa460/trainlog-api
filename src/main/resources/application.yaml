spring:
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:trainlog}
    user: ${FLYWAY_USER:root}
    password: ${FLYWAY_PASSWORD}
  application:
    name: trainlog
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:trainlog}
    username: ${POSTGRES_USER:trainlog_app}
    password: ${POSTGRES_PASSWORD}
autentication:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 3600000
