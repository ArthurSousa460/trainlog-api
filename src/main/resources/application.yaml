spring:
  config:
    import: optional:file:.env[.properties]
    jpa:
      hibernate:
        ddl-auto=validate:
    flyway:
      enabled: true
      locations: classpath:db/migration
  application:
    name: trainlog
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:trainlog}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
